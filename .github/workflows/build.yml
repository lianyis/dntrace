name: Build & Release

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
      - "dn42/geofeed.snapshot.csv"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: 0
      GOOS:   ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Refresh embedded geofeed snapshot
        run: |
          set -Eeuo pipefail
          curl -fsSL --max-time 60 https://dn42.lianyi.me/dntrace/geofeed.csv -o dn42/geofeed.snapshot.csv
          head -1 dn42/geofeed.snapshot.csv
          wc -l dn42/geofeed.snapshot.csv

      - name: Resolve build metadata
        run: |
          set -Eeuo pipefail
          BUILD_VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMMIT_SHA1="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          PLATFORM="${GOOS}_${GOARCH}"
          EXT=""; [ "${GOOS}" = "windows" ] && EXT=".exe"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${BUILD_DATE}"       >> "$GITHUB_ENV"
          echo "COMMIT_SHA1=${COMMIT_SHA1}"     >> "$GITHUB_ENV"
          echo "PLATFORM=${PLATFORM}"           >> "$GITHUB_ENV"
          echo "EXT=${EXT}"                     >> "$GITHUB_ENV"

      - name: Build dntrace
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          LDFLAGS="-X github.com/lianyis/dntrace/config.Version=${BUILD_VERSION} \
                   -X github.com/lianyis/dntrace/config.BuildDate=${BUILD_DATE} \
                   -X github.com/lianyis/dntrace/config.CommitID=${COMMIT_SHA1} \
                   -w -s"
          go build -trimpath -o "dist/dntrace_${PLATFORM}${EXT}" -ldflags "$LDFLAGS" .
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dntrace_${{ env.PLATFORM }}${{ env.EXT }}
          path: dist/dntrace_${{ env.PLATFORM }}${{ env.EXT }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
